<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1522" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Nền tảng tư vấn học đường của Trường THPT Nguyễn Bỉnh Khiêm." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Trường THPT Nguyễn Bỉnh Khiêm | Tư vấn học đường</title>
    <script>
      // Áp theme trước khi React nạp để tránh nháy màu. Mặc định: sáng.
      try {
        if (localStorage.getItem('sc-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
